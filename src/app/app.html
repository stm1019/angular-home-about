<!-- nav -->
<nav class="pill-group">
    <div class="navbar-nav">
        <!-- The [routerLinkActiveOptions] object ensures the root path exact match triggers the active class -->
        <a class="pill" routerLink="/" routerLinkActive="active-menu-item" [routerLinkActiveOptions]="{exact: true}">Home</a>
        <a class="pill" routerLink="/about" routerLinkActive="active-menu-item">About</a>
    </div>
</nav>

<!-- main content container -->
<div class="jumbotron">
    <div class="container">
        <div class="row">
            <div class="col-sm-8 offset-sm-2">
                <router-outlet></router-outlet>
            </div>
        </div>
    </div>
</div>

<!-- This is where Angular swaps out the content of your pages -->
<router-outlet></router-outlet>
